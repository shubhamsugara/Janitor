# Example configuration with fake account IDs. Copy to config/janitor.yaml for real settings.
provider: mock            # mock | aws (overridable by JANITOR_PROVIDER)
admin:                    # owns the AMIs and shares them with the other accounts
  account: "111111111111"
  name: tools
  profile: example-tools  # needs role_arn and source_profile in your AWS config
  regions: [us-east-1, us-west-2, eu-west-1]   # admin's regions; the default for other accounts
member_role: example-janitor-read   # the role assumed in every other account, from the same login
accounts:                 # optional display names; accounts in AMI launch permissions are found anyway
  "555555555555": { name: sbx, profile: example-sbx }   # use this AWS profile's role_arn and
                                                         # role_session_name (same source login)
  "222222222222": { name: dev }
  "666666666666": { name: uat }
  "777777777777": { name: qas }                         # or { name: qas, role: example-qas-read }
  "333333333333": { name: prd, regions: [us-east-1, us-west-2] }   # only where it has resources
# ignore_accounts: ["444444444444"]   # never contacted; AMIs shared only with these can be
#                                     # deleted (warning W7, type to confirm). Only list accounts
#                                     # you are sure don't need the AMIs.
policy:
  orphan_after_days: 90
  min_age_days: 30
  protected_tags: { retain: "true", "janitor:keep": "true" }
  typed_confirm_min_items: 10
pricing:                  # fallback only: real rates come from fixtures/prices.json
  snapshot_gb_month: 0.05
  snapshot_archive_gb_month: 0.0125
  rds_snapshot_gb_month: 0.095
  volume_gb_month: { gp3: 0.08, gp2: 0.10, io1: 0.125, io2: 0.125, st1: 0.045, sc1: 0.015, standard: 0.05 }
scan:
  concurrency: 8          # parallel AWS calls per scan (1-32)
deployments:              # the Deployments page: tags your deploy tool writes (these are the defaults)
  tags:
    app: [role, app]      # first tag present wins; else the ASG or ECS service name
    env: [env]            # else the account's name
    version: [version]    # ECS: else the first container's image tag
    state: deploy-state   # only ASGs with this tag are deployments
    deployment_id: deployment-id
